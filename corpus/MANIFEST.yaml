# --- Avisos que gobiernan el parser (docs/adr/001-corpus-fuente-boe.md) ---
avisos:
  - id: apartado-no-estructural
    texto: >
      El apartado NO es un elemento del arbol XML: va como prefijo textual dentro de
      <p class="parrafo"> ("1. Se debera conducir..."). Como LegalRef es
      norma#artNN.apartado y retrieval-metrics.md §2 considera fallo citar art21 cuando
      lo correcto es art21.1, la granularidad de apartado se DERIVA del texto.
  - id: dos-espacios-de-numeracion
    texto: >
      Este documento contiene el Real Decreto (con un unico "Articulo unico") y, colgando
      de el, el Reglamento General de Circulacion con su propia numeracion 1..N. LegalRef
      numera los articulos del REGLAMENTO; el articulo unico del RD se indexa aparte.
  - id: imagenes-sin-texto
    texto: >
      623 bloques <p class="imagen"> son senales de trafico. Producen chunks sin texto
      util y quedan fuera del indice; se declara en el README y afecta a la materia
      "senalizacion".

