# --- Avisos que gobiernan el parser (docs/adr/001-corpus-fuente-boe.md) ---
avisos:
  - id: apartado-no-estructural
    texto: >
      El apartado NO es un elemento del arbol XML: va como prefijo textual dentro de
      <p class="parrafo"> ("1. Se debera conducir..."). Como LegalRef es
      norma#artNN.apartado y retrieval-metrics.md §2 considera fallo citar art21 cuando
      lo correcto es art21.1, la granularidad de apartado se DERIVA del texto.
  - id: tres-espacios-de-numeracion
    texto: >
      CORREGIDO el 2026-08-10 (ADR-020): no son dos espacios, son TRES, y ademas hay una
      colision dentro del cuerpo. (1) Los 7 preceptos propios del Real Decreto, antes de
      la frontera "REGLAMENTO GENERAL DE CIRCULACION" en el byte 15706. (2) El Reglamento,
      que es el contenedor por defecto y no lleva prefijo. (3) El articulado interno de
      cada ANEXO, que reinicia en 1. Y ademas TITULO VI, anadido por RD 465/2025, reinicia
      en 151 y choca con los 151-158 del TITULO V. Con designador plano colisionan 47 de
      236 referencias, medido. El contenedor entra en la LegalRef: rd-unico, anexoii-1,
      tv-151, tvi-151.
  - id: titulo-vi-va-detras-de-los-anexos
    texto: >
      TITULO VI aparece FISICAMENTE despues de los cuatro anexos en el fichero. Un
      encabezado TITULO devuelve el parser al cuerpo, y entrar en un ANEXO limpia la
      jerarquia heredada; sin lo primero, el articulo 151 de zonas urbanas sale como
      anexoii-151.
  - id: varias-versiones-por-bloque
    texto: >
      78 de los 335 bloques traen mas de una <version> (65 con dos, 12 con tres, 1 con
      cuatro). La vigente es la ULTIMA. Leer la primera serviria redaccion superada en un
      cuarto del corpus, y seria invisible: la cita es real, G-QUOTE-LIT se queda en 1,00
      y G-HALLUC en 0.
  - id: imagenes-sin-texto
    texto: >
      623 bloques <p class="imagen"> son senales de trafico. Producen chunks sin texto
      util y quedan fuera del indice; se declara en el README y afecta a la materia
      "senalizacion".

