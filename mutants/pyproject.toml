[project]
name = "citebound"
version = "0.1.0"
description = "Tutor de normativa de circulación con cita cerrada: no puede citar un artículo que no haya recuperado"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"          # ADR-002: MWAA no ofrece más, y wheels de torch/MPS
authors = [{ name = "Samuel Viciana Moreno" }]

# ==============================================================================
# Versiones EXACTAS (`==`), nunca `^` ni `~`  ·  constitución §7.2
# Los rangos de docs/STACK.md son la investigación; el pin vive aquí.
# Toda versión elegida queda anotada en docs/JOURNAL.md.
# Lista aprobada en bloque por Samuel el 2026-08-10 (docs/PARA-SAMUEL.md Q-011).
# Cualquier paquete fuera de esta lista exige permiso explícito en el mismo turno.
# ==============================================================================
dependencies = [
  # --- API y modelos de datos ---
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  # --- Almacén ---
  "psycopg[binary,pool]==3.3.4",
  "pgvector==0.5.0",
  # --- Agente. LangGraph SOLO como máquina de estados (R7).
  #     `langchain*` no entra aquí: check_deps.py lo verifica.
  #     -prebuilt y -checkpoint van pineados exactos a propósito: hubo un
  #     cambio rompedor en langgraph-prebuilt publicado sin restricción. ---
  "langgraph==1.2.10",
  "langgraph-prebuilt==1.1.0",
  "langgraph-checkpoint==4.2.0",
  # --- Modelos. El reranker corre EN PROCESO con MPS, nunca por Ollama (R8).
  #     El acceso al generador es HTTP contra /v1/chat/completions vía httpx. ---
  "sentence-transformers==5.7.0",
  "httpx==0.28.1",
  # --- Numérico ---
  "numpy==2.5.2",
  "scipy==1.18.0",
  # --- Observabilidad ---
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  # --- Parseo defensivo del XML del BOE.
  #     `xml.etree` no defiende contra la expansión de entidades y no tiene interruptor
  #     para desactivarla. Aprobado por Samuel el 2026-08-10 fuera de la lista de Q-011:
  #     una librería probada es mejor que una guarda escrita a mano, aunque la guarda
  #     estuviera bien hecha y cubierta con un test de billion laughs. ---
  "defusedxml==0.7.1",

  # --- Validación de artefactos de gobierno (golden set, GOALS, informes) ---
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "defusedxml>=0.7.1",
]

[project.scripts]
citebound = "citebound.cli:main"

[dependency-groups]
dev = [
  # --- Tests. --cov-context=test es obligatorio: es lo que hace medible
  #     "un test por función" (constitución §2.6). ---
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "hypothesis==6.165.2",
  "testcontainers==4.15.0",
  "schemathesis==4.24.3",
  # --- Estáticos y anti-gaming ---
  "ruff==0.16.2",
  "mypy==2.3.0",
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "mutmut==3.7.0",
  "types-defusedxml>=0.7.0.20260504",
]
evals = [
  # Ragas NO entra: congelado desde febrero de 2026, fuera del gate (Q-002 nº 1).
  "deepeval==4.1.5",
  "mlflow==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citebound"]

# ==============================================================================
# [tool.gate] · copia literal de docs/RULES.md §4. Lo lee un script, no un humano.
# ==============================================================================
[tool.gate]
testable = [
  "src/citebound/domain",
  "src/citebound/ingest/boe_xml.py",
  "src/citebound/ingest/chunking.py",
  "src/citebound/retrieval/fusion.py",
  "src/citebound/retrieval/query_builder.py",
  "src/citebound/agent/stream_guard.py",
  "src/citebound/evals/scoring.py",
  "src/citebound/evals/bootstrap.py",
]
tdd_obligatorio = [
  "src/citebound/domain",
  "src/citebound/ingest/boe_xml.py",
  "src/citebound/ingest/chunking.py",
  "src/citebound/retrieval/fusion.py",
  "src/citebound/agent/stream_guard.py",
  "src/citebound/evals/scoring.py",
  # Q-014, respondida por Samuel el 2026-08-13: ante la contradiccion entre RULES §3
  # (que lo declara TDD obligatorio) y RULES §4 (que no lo listaba), manda LA MAS
  # ESTRICTA. Esta linea es por tanto lo UNICO que hoy no es copia literal de §4;
  # queda pendiente que Samuel la anada alli para que los dos documentos coincidan.
  "src/citebound/evals/bootstrap.py",
]
tdd_prohibido = [
  "src/citebound/agent/graph.py",
  "src/citebound/api",
  "src/citebound/providers",
  "prompts",
]
excluido = [
  "src/citebound/api",
  "src/citebound/providers",
  "src/citebound/db",
  "prompts",
  "ui",            # ADR-019: la interfaz habla por HTTP y no lleva TDD
]
cobertura_linea_min  = 85
mutantes_muertos_min = 70
sin_test_requerido = [
  # Cada entrada exige motivo. El gate RECHAZA una entrada sin motivo.
  { symbol = "domain.models.*.__repr__", motivo = "generado por Pydantic" },
]

# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]     # assert es el punto de los tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
# NO hay lista de `files` aquí, y es deliberado. La hubo, escrita a mano, y se quedó en
# `domain` + `ingest` mientras `evals/` entraba en [tool.gate].testable sin que nadie lo
# notara: dos listas divergiendo en silencio, que es justo el fallo contra el que avisaba
# el comentario que ocupaba este sitio. Ahora `make typecheck` deriva las rutas de
# [tool.gate].testable y se las pasa a mypy. Una sola lista, y la que manda.
#
# `uv run mypy` a secas ya no comprueba nada por su cuenta: usa `make typecheck`.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# La raíz, para que los tests de contrato puedan importar `scripts/`: los
# comprobadores del gate son código con lógica de verdad y merecen su propio test,
# no solo ejecutarse a ciegas desde el Makefile.
pythonpath = ["."]
# --cov-context=test es OBLIGATORIO: sin él check_function_coverage.py no puede
# saber qué test ejerció cada línea, y "un test por función" deja de ser medible.
addopts = "--strict-markers --strict-config --cov=citebound --cov-context=test"
markers = [
  "integration: exige testcontainers. Nunca en el gate rápido",
  "adversarial: suite de inyección y casos límite",
]

[tool.coverage.run]
branch = true
source = ["src/citebound"]
# `dynamic_context = "test_function"` NO va aqui, y quitarlo arreglo un fallo real. Chocaba
# con el `--cov-context=test` de addopts: coverage avisaba «Conflicting dynamic contexts» y
# el fichero .coverage resultante se quedaba SIN la tabla `context`. Eso rompia la seleccion
# de tests por mutante de mutmut («no such table: context»), que empezaba a declarar
# supervivientes falsos -- boe_xml__mutmut_70 figuraba vivo y moria con los tests que ya
# existian. Un aviso de configuracion que degradaba G-MUT en silencio (JOURNAL 2026-08-13).

[tool.coverage.json]
# Sin esto el informe JSON NO lleva los contextos, aunque pytest los grabe en el
# .coverage: `--cov-context=test` los registra y esta opcion los publica. Es lo que
# hace medible "un test por funcion" (constitucion §2.6); sin ella,
# check_function_coverage.py no puede saber que test ejercio cada linea.
show_contexts = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mutmut]
# Solo los paquetes de [tool.gate].tdd_obligatorio que ya existen. Es lo unico que
# distingue cobertura de verificacion: 100 % de lineas cubiertas y 0 % de mutantes
# muertos significa que la suite ejecuta el codigo sin comprobar nada.
# `source_paths`, no `paths_to_mutate`: la vieja esta deprecada y mutmut lo avisaba en cada
# corrida. Lo mismo con `tests_dir`, que ademas NO era cosmetico -- ver abajo.
source_paths = [
  "src/citebound/domain/legalref.py",
  "src/citebound/ingest/boe_xml.py",
  "src/citebound/ingest/chunking.py",
  # Entran al cerrar 1a. `scoring.py` estaba en [tool.gate].tdd_obligatorio desde el
  # primer dia y fuera de aqui: G-MUT medía sobre 3 de los 4 ficheros que le tocan, que
  # es justo "dos listas que divergen en silencio". `bootstrap.py` entra por Q-014,
  # donde Samuel decide que ante dos reglas contradictorias manda la mas estricta.
  "src/citebound/evals/scoring.py",
  "src/citebound/evals/bootstrap.py",
  # Entra al construirse en la fase 2. Estaba en [tool.gate].tdd_obligatorio de RULES §4
  # desde el primer dia y fuera de aqui: la MISMA divergencia silenciosa que ya arreglaron
  # las dos lineas de arriba, por tercera vez. El fichero existe, la regla lo nombra, y
  # G-MUT medía sobre cinco de los seis que le tocan sin que nada lo dijera.
  "src/citebound/retrieval/fusion.py",
  # Fase 3. `domain/` entero es tdd_obligatorio en RULES §4, y el test de listas del gate lo
  # cazó en cuanto existió el fichero — que es exactamente para lo que se escribió.
  "src/citebound/domain/citation.py",
]
# mutmut copia el arbol a `mutants/` y solo lleva lo que le digas: sin esto, los
# tests de contrato no encuentran `citebound.api` y falla al recolectar.
# `docs/GOALS.yaml` entra porque `golden_validate` LEE de ahi sus umbrales y sus tests lo
# comprueban: sin el fichero, la corrida de mutacion ni siquiera arranca. Es la contrapartida
# de no escribir los numeros en el codigo, y es barata.
# `evals/golden/` entra desde 1d: los tests de contrato de la cola y del montaje leen la
# cola real y el golden set, y sin ellos la corrida de mutacion ni siquiera arranca.
# `docs/RULES.md` entra por el mismo motivo desde que test_listas_del_gate.py compara las dos
# listas del gate: lee la del Markdown, que es la que manda, en vez de hacer una cuarta copia.
also_copy = [
  "src/", "tests/", "scripts/", "corpus/", "docs/CONTRACTS/", "docs/GOALS.yaml",
  "docs/RULES.md", "evals/golden/", "compose.yaml"
]
# La suite de mutacion corre sin integracion: levantar Postgres por cada mutante
# multiplicaria minutos por cientos y el gate se acabaria desactivando.
#
# `tests/` va AQUI y no en el `tests_dir` deprecado, y esto no era cosmetico: con la clave
# vieja ignorada, mutmut no sabia donde estan los tests y clasificaba los 108 mutantes de
# `bootstrap.py` como "no tests" -- ni muertos ni vivos, simplemente sin medir. Un aviso de
# deprecacion que degradaba G-MUT en silencio (JOURNAL 2026-08-13).
pytest_add_cli_args_test_selection = [
  "tests/", "-m", "not integration", "--no-cov", "-p", "no:randomly"
]
